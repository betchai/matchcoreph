# fly.toml app configuration file for matchcoreph
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'matchcoreph'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1
    soft_limit = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1